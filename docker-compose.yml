name: convertflow
x-backend: &backend
  build: ./backend
  environment: &environment
    DATABASE_URL: postgresql+psycopg://convertflow:${POSTGRES_PASSWORD:-convertflow}@postgres/convertflow
    REDIS_URL: redis://redis:6379/0
    STORAGE_ROOT: /data
    LEASE_SECONDS: ${LEASE_SECONDS:-30}
    HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-5}
    REDISPATCH_SECONDS: ${REDISPATCH_SECONDS:-30}
  volumes:
    - storage:/data
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: convertflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-convertflow}
      POSTGRES_DB: convertflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U convertflow -d convertflow]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./backend
    environment: *environment
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    ports:
      - 127.0.0.1:8000:8000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: [celery, -A, app.tasks.celery_app:celery_app, worker, --loglevel=INFO, --concurrency=1, --hostname=worker@%h]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.tasks.celery_app:celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong']
      interval: 20s
      timeout: 10s
      retries: 5
  dispatcher:
    <<: *backend
    command: [python, -m, app.services.dispatcher]
  frontend:
    build: ./frontend
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health/ready]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  storage:
  postgres-data:
  redis-data:
