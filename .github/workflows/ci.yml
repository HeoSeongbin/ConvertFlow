name: validation
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: ruff check backend scripts
      - run: python -m pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: python scripts/smoke.py
      - run: python scripts/smoke_phase2.py
      - name: Phase 3 isolated retry and cancellation integration
        shell: bash
        run: |
          docker compose stop dispatcher
          trap 'docker compose start dispatcher' EXIT
          docker compose exec -T api python - < scripts/smoke_phase3.py
      - name: Phase 4 real process kill and fencing
        shell: bash
        run: |
          docker compose stop dispatcher
          trap 'docker compose start dispatcher' EXIT
          docker compose cp scripts/smoke_phase4.py api:/tmp/smoke_phase4.py
          docker compose exec -T -e PYTHONPATH=/app api python /tmp/smoke_phase4.py
      - name: Phase 4 Compose prefork and service outages
        run: python scripts/smoke_phase4_compose.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
