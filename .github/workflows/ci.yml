name: validation
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: python -m compileall -q backend/app scripts
      - run: python -m pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run lint && npm run build
        working-directory: frontend
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Real API, browser, retry, cancellation and process/service fault suites
        run: python scripts/validate_phase7.py --faults
      - name: Phase 5 monitoring and load checks
        run: python scripts/benchmark_phase5.py --output phase5-load.json
      - name: Phase 5 current task attribution
        run: python scripts/smoke_phase5_active.py
      - if: always()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            artifacts/phase7/
            frontend/playwright-report/
            frontend/test-results/
            phase5-load.json
          retention-days: 7
      - if: always()
        run: docker compose down -v
